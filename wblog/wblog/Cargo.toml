[package]
name = "wblog"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
grass = "0.13.4"
live-server = "0.11.1"
