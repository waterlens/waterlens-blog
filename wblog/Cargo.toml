[workspace]
members = ["wblog", "wblog-asciidoc", "asciidoc-waterlens-html5"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
asciidoc-parser = "0.29.6"
asciidoc-waterlens-html5 = { path = "asciidoc-waterlens-html5" }
wblog-asciidoc = { path = "wblog-asciidoc" }

[workspace.lints.rust]
unsafe_code = "forbid"
